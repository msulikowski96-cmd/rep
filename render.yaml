services:
  - type: web
    name: taxi-zamowienia
    runtime: node
    plan: free               # prototyp: dane znikają przy restarcie, usługa usypia po bezczynności
    buildCommand: echo "brak zależności do zainstalowania"
    startCommand: node server.js
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false          # ustawisz w Dashboard przy wdrożeniu
