<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel kierowcy</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="wrap wide"><h1>Panel kierowcy</h1><button class="ghost hidden" id="logout" type="button">Wyloguj</button></div></header>
<main class="wrap wide">
  <section class="card" id="loginCard">
    <h2>Logowanie</h2>
    <form id="loginForm">
      <label for="pw">Hasło</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="full" type="submit">Zaloguj</button>
      <div id="loginErr" class="msg err hidden" role="alert"></div>
    </form>
  </section>
  <section id="panel" class="hidden">
    <div class="toolbar" id="filters" role="group" aria-label="Filtr statusu"></div>
    <div id="list" aria-live="polite"></div>
  </section>
</main>
<script src="/admin.js"></script>
</body>
</html>
